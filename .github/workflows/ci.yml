name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (95 testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restaurar dependências
        run: dotnet restore backend/GestaoColaboradores.sln

      - name: Compilar
        run: dotnet build backend/GestaoColaboradores.sln --no-restore --configuration Release

      # Os testes de integração sobem um PostgreSQL real via Testcontainers, que depende do
      # Docker já presente no runner ubuntu — num runner Windows ou macOS isto falharia.
      - name: Testar
        run: dotnet test backend/GestaoColaboradores.sln --no-build --configuration Release --nologo

      - name: Conferir formatação
        run: dotnet format backend/GestaoColaboradores.sln --verify-no-changes

  frontend:
    name: Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Conferir formatação
        run: npm run format:check

      # watch já é false fora de TTY; explicitar evita que uma mudança de ambiente
      # transforme o job num processo que nunca termina.
      - name: Testar
        run: npx ng test --watch=false

      - name: Build de produção
        run: npm run build
