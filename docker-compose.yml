services:
  db:
    image: postgres:16-alpine
    container_name: gestao-db
    environment:
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: gestao123        # TODO: mover para .env antes de publicar o repo
      POSTGRES_DB: gestao_colaboradores
    ports:
      - "5432:5432"
    volumes:
      - gestao-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao_colaboradores"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestao-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=gestao_colaboradores;Username=gestao;Password=gestao123"
      # Segredo próprio do contêiner, diferente do valor de desenvolvimento versionado.
      Jwt__Secret: "${JWT_SECRET:-segredo-do-compose-trocar-em-producao-32c}"
      Jwt__ExpiracaoMinutos: "60"
      Jwt__Emissor: "GestaoColaboradores"
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestao-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  gestao-pgdata:
