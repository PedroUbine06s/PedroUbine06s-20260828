server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rotas do Angular são resolvidas no cliente. Sem este fallback, abrir
    # /usuarios?status=inativos direto ou recarregar a página daria 404 do nginx,
    # justamente nos links que a aplicação passou a produzir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O portal chama /api/v1/... em caminho relativo. Em desenvolvimento quem resolve
    # isso é o proxy do ng serve; aqui é o nginx, apontando para o contêiner da API.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Os arquivos com hash no nome podem ser cacheados sem medo; o index, não,
    # senão o navegador continuaria pedindo os bundles de uma versão anterior.
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
